name: release

# Pushing a tag like v0.2.0 (see `npm run release`) builds signed installers
# for Windows and Linux and publishes them, plus the `latest.json` update
# feed that installed copies of Lumio read, as a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the Linux build compatible with older distributions
          # (elementary OS 8 is based on Ubuntu 24.04).
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the app version
        shell: bash
        run: |
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version (use npm run release)"
            exit 1
          fi

      - name: Release notes from the tag message
        id: notes
        shell: bash
        run: |
          git fetch --force --tags
          {
            echo "body<<LUMIO_NOTES_EOF"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "LUMIO_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Signing key must work
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. Add the content of ~/.tauri/lumio.key under Settings > Secrets and variables > Actions (docs/RELEASING.md, step 3)."
            exit 1
          fi
          echo "signing test" > "$RUNNER_TEMP/sign-test.txt"
          if ! out=$(npx tauri signer sign "$RUNNER_TEMP/sign-test.txt" 2>&1 < /dev/null); then
            reason=$(echo "$out" | sed -E 's/\x1b\[[0-9;]*m//g' | grep -iE "error|password|failed" | tail -1)
            echo "::error::The signing key secret does not work: ${reason}. TAURI_SIGNING_PRIVATE_KEY must be the full content of ~/.tauri/lumio.key; delete the TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret if the key has no password."
            exit 1
          fi
          echo "Signing key OK"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # created with `npx tauri signer generate` (see docs/RELEASING.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lumio ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # wrapper that surfaces build errors as annotations on the run page
          tauriScript: bash scripts/ci-tauri.sh
          args: --bundles ${{ matrix.bundles }}
